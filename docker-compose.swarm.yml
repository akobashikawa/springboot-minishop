version: '3.8'

# ========================================
# CONFIGS - Configuraciones para Swarm
# ========================================
configs:
  orders-service-config:
    file: ./orders-service/config/application-docker-swarm.yml
  products-service-config:
    file: ./products-service/config/application-docker-swarm.yml
  notifications-service-config:
    file: ./notifications-service/config/application-docker-swarm.yml
  nginx-default-config:
    file: ./nginx/conf.d/default.conf
  nginx-proxy-params:
    file: ./nginx/proxy_params
  nginx-index-html:
    file: ./nginx/html/index.html

services:
  # ========================================
  # NATS Server (Message Broker) - Instancia dedicada para Mini-Shop
  # ========================================
  nats-server:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"      # NATS Client Port (puerto externo 4222)
      - "8222:8222"      # HTTP Monitoring Port (puerto externo 8222)
      - "6222:6222"      # Cluster Port (puerto externo 6222)
    command: 
      - "--http_port"
      - "8222"
      - "--name"
      - "mini-shop-nats-dedicated"
      - "--server_name"
      - "mini-shop-instance"
    environment:
      - NATS_CLUSTER_LISTEN=0.0.0.0:6222
      - NATS_CLUSTER_ADVERTISE=${DOCKER_SWARM_IP:-10.0.1.14}:6222
    volumes:
      - nats_data:/data
    networks:
      - mini-shop-network
    # 🔥 CONFIGURACIÓN PARA SWARM
    deploy:
      replicas: 1                    # instancias de NATS
      placement:
        constraints:
          - node.role == manager     # Solo en nodos manager
        preferences:
          - spread: node.id          # Distribuir en diferentes nodos
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1              # Actualizar de a 1 por vez
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.3
      rollback_config:
        parallelism: 1
        delay: 0s
        failure_action: pause
        monitor: 60s
        max_failure_ratio: 0.3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      labels:
        - "service.name=nats-server"
        - "service.version=2.10"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ========================================
  # Orders Service
  # ========================================
  orders-service:
    image: mini-shop/orders-service:latest
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker-swarm
      - JAVA_OPTS=-Xmx768m -Xms512m
    # 🔥 USAR CONFIGS EN LUGAR DE VOLUMES
    configs:
      - source: orders-service-config
        target: /app/config/application-docker-swarm.yml
        mode: 0444
    networks:
      - mini-shop-network
    # 🔥 CONFIGURACIÓN PARA SWARM
    deploy:
      replicas: 1                    # instancias del servicio
      placement:
        constraints:
          - node.role == worker      # Solo en nodos worker
        preferences:
          - spread: node.id          # Distribuir en diferentes nodos
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '0.8'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 384M
      labels:
        - "service.name=orders-service"
        - "service.type=api"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ========================================
  # Products Service
  # ========================================
  products-service:
    image: mini-shop/products-service:latest
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker-swarm
      - JAVA_OPTS=-Xmx768m -Xms512m
    # 🔥 USAR CONFIGS EN LUGAR DE VOLUMES
    configs:
      - source: products-service-config
        target: /app/config/application-docker-swarm.yml
        mode: 0444
    networks:
      - mini-shop-network
    # 🔥 CONFIGURACIÓN PARA SWARM
    deploy:
      replicas: 1                    # instancias del servicio
      placement:
        constraints:
          - node.role == worker      # Solo en nodos worker
          - node.labels.type != database  # No en nodos marcados como database
        preferences:
          - spread: node.id          # Distribuir en diferentes nodos
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          cpus: '0.8'
          memory: 768M
        reservations:
          cpus: '0.4'
          memory: 384M
      labels:
        - "service.name=products-service"
        - "service.type=api"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ========================================
  # Notifications Service
  # ========================================
  notifications-service:
    image: mini-shop/notifications-service:latest
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker-swarm
      - JAVA_OPTS=-Xmx768m -Xms512m
    # 🔥 USAR CONFIGS EN LUGAR DE VOLUMES
    configs:
      - source: notifications-service-config
        target: /app/config/application-docker-swarm.yml
        mode: 0444
    networks:
      - mini-shop-network
    # 🔥 CONFIGURACIÓN PARA SWARM
    deploy:
      replicas: 1                    # instancias del servicio
      placement:
        constraints:
          - node.role == worker      # Solo en nodos worker
        preferences:
          - spread: node.id          # Distribuir en diferentes nodos
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      labels:
        - "service.name=notifications-service"
        - "service.type=api"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ========================================
  # Nginx (Reverse Proxy y Load Balancer)
  # ========================================
  nginx:
    image: nginx:alpine
    ports:
      - "8088:80"  # Puerto fácil de cambiar
    # 🔥 USAR CONFIGS EN LUGAR DE VOLUMES
    configs:
      - source: nginx-default-config
        target: /etc/nginx/conf.d/default.conf
        mode: 0444
      - source: nginx-proxy-params
        target: /etc/nginx/proxy_params
        mode: 0444
      - source: nginx-index-html
        target: /usr/share/nginx/html/index.html
        mode: 0444
    networks:
      - mini-shop-network
    # 🔥 CONFIGURACIÓN PARA SWARM
    deploy:
      replicas: 1                    # instancias de Nginx
      placement:
        constraints:
          - node.role == manager     # Solo en nodos manager (entrada al cluster)
        preferences:
          - spread: node.id          # Distribuir en diferentes managers
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
      labels:
        - "service.name=nginx"
        - "service.type=proxy"

# ========================================
# Networks - Para Swarm usa overlay
# ========================================
networks:
  mini-shop-network:
    driver: overlay                  # Cambiar de bridge a overlay para Swarm
    name: mini-shop-net
    attachable: true
    ipam:
      config:
        - subnet: 10.0.9.0/24

# ========================================
# Volumes
# ========================================
volumes:
  nats_data:
    name: mini-shop-nats-data
  nginx_logs:
    name: mini-shop-nginx-logs
