# mini-shop-k8s.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: mini-shop
---
# ========================================
# 1. NATS Server (Message Broker)
# ========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-server
  namespace: mini-shop
  labels:
    app: nats-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats-server
  template:
    metadata:
      labels:
        app: nats-server
    spec:
      containers:
      - name: nats
        image: nats:2.10-alpine
        ports:
        - containerPort: 4222 # Client port
        - containerPort: 8222 # HTTP Monitoring port
        - containerPort: 6222 # Cluster port (if clustering NATS)
        command:
          - nats-server
          - "--http_port"
          - "8222"
          - "--name"
          - "mini-shop-nats-dedicated"
          - "--server_name"
          - "mini-shop-instance"
        volumeMounts:
        - name: nats-data-volume
          mountPath: /data
        livenessProbe: # Checks if the container is still running
          httpGet:
            path: /healthz
            port: 8222
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe: # Checks if the container is ready to serve requests
          httpGet:
            path: /healthz
            port: 8222
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
      volumes:
      - name: nats-data-volume
        persistentVolumeClaim:
          claimName: nats-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nats-server-svc
  namespace: mini-shop
  labels:
    app: nats-server
spec:
  selector:
    app: nats-server
  ports:
    - name: client
      protocol: TCP
      port: 4222
      targetPort: 4222
    - name: http-monitor
      protocol: TCP
      port: 8222
      targetPort: 8222
    - name: cluster
      protocol: TCP
      port: 6222
      targetPort: 6222
  type: ClusterIP # Internal to the cluster
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-data-pvc
  namespace: mini-shop
spec:
  accessModes:
    - ReadWriteOnce # This assumes a single-node setup or a PV provisioner
  resources:
    requests:
      storage: 1Gi # Adjust storage as needed for NATS data
---
# ========================================
# 2. Orders Service
# ========================================
# ConfigMap for orders-service configuration
# Replace the data with the actual content of your orders-service/config files
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-service-config
  namespace: mini-shop
data:
  # Example: application.properties or application-docker.properties content
  # config.properties: |
  #   spring.application.name=orders-service
  #   nats.url=nats://nats-server-svc:4222 # Connect to NATS via its Kubernetes Service
  #   # ... other configurations
  # You'll need to create application.properties or similar files in your local config directory
  # and then manually add their content here, or use `kubectl create configmap --from-file`
  application.properties: |-
    spring.profiles.active=docker
    spring.application.name=orders-service
    management.endpoints.web.exposure.include=health,info,metrics
    management.endpoint.health.show-details=always
    nats.url=nats://nats-server-svc:4222 # Connect to NATS via its Kubernetes Service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: mini-shop
  labels:
    app: orders-service
spec:
  replicas: 1 # Start with 1 replica, scale up later if needed
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
    spec:
      containers:
      - name: orders-service
        image: 52.168.134.57:31996/mini-shop-orders-service:latest # <--- REPLACE IMAGE
        ports:
        - containerPort: 8081
        env:
        - name: JAVA_OPTS
          value: "-Xmx512m -Xms256m"
        # SPRING_PROFILES_ACTIVE is set via ConfigMap mounted as a file
        volumeMounts:
        - name: orders-config-volume
          mountPath: /app/config # Mount ConfigMap here
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 60 # Increased start_period
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
      volumes:
      - name: orders-config-volume
        configMap:
          name: orders-service-config
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service-svc
  namespace: mini-shop
  labels:
    app: orders-service
spec:
  selector:
    app: orders-service
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
  type: ClusterIP # Internal to the cluster
---
